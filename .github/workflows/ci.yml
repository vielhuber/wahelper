name: CI

env:
    CI: true

on:
    push:
        tags:
            - 'v*'
            - '[0-9]*'

jobs:
    publish:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Node
              uses: actions/setup-node@v6
              with:
                  node-version-file: '.nvmrc'
                  registry-url: 'https://registry.npmjs.org'
                  package-manager-cache: false

            - name: PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none

            - name: NPM
              run: npm install

            - name: Composer
              run: composer install --no-interaction

            - name: Verify version
              run: test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}"

            - name: Build
              run: npm run prod --if-present

            - name: Test PHP
              run: ./vendor/bin/phpunit

            - name: Publish
              run: npm publish
